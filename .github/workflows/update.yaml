name: Update game data
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: gamescore-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: Fetch NHL data and publish to the data branch
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 -u - <<'PY'
          import json, os, shutil, subprocess, sys, time, urllib.request, urllib.error
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          TEAM = 'TOR'
          BASE = 'https://api-web.nhle.com/v1'
          MAX_NEW = 30
          BUDGET = int(os.environ.get('GS_BUDGET', 45 * 60))
          PAUSE = int(os.environ.get('GS_PAUSE', 10))
          TOI_EVERY = 120
          WORKERS = 8

          REPO = os.environ.get('REPO', '')
          TOKEN = os.environ.get('GH_TOKEN', '')
          REMOTE = os.environ.get('GS_REMOTE') or 'https://x-access-token:%s@github.com/%s.git' % (TOKEN, REPO)
          START = time.time()


          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (gamescore)'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode('utf-8'))


          def git(*args, check=True):
              r = subprocess.run(['git'] + list(args), capture_output=True, text=True)
              if check and r.returncode != 0:
                  raise RuntimeError('git %s failed: %s' % (args[0], (r.stderr or '').replace(TOKEN, '***') if TOKEN else r.stderr))
              return r


          def setup():
              if os.path.exists('out'):
                  shutil.rmtree('out')
              r = subprocess.run(['git', 'clone', '-q', '--depth', '1', '--branch', 'data', REMOTE, 'out'], capture_output=True, text=True)
              if r.returncode != 0:
                  print('No data branch yet, starting a new one')
                  os.makedirs('out')
                  os.chdir('out')
                  git('init', '-q', '-b', 'data')
                  git('remote', 'add', 'origin', REMOTE)
              else:
                  os.chdir('out')
              git('config', 'user.name', 'github-actions')
              git('config', 'user.email', 'actions@users.noreply.github.com')


          def publish(stamp):
              git('add', '-A')
              has_head = git('rev-parse', '--verify', '-q', 'HEAD', check=False).returncode == 0
              if has_head and git('diff', '--cached', '--quiet', check=False).returncode == 0:
                  return False
              if has_head:
                  git('commit', '-q', '--amend', '-m', 'data ' + stamp)
              else:
                  git('commit', '-q', '-m', 'data ' + stamp)
              git('push', '-q', '-f', 'origin', 'HEAD:data')
              return True


          def mk(g, ds=None):
              a = g.get('awayTeam') or {}
              h = g.get('homeTeam') or {}
              return {'id': g.get('id'), 'date': g.get('gameDate') or ds, 'start': g.get('startTimeUTC'),
                      'away': a.get('abbrev'), 'home': h.get('abbrev'), 'state': g.get('gameState'),
                      'as': a.get('score'), 'hs': h.get('score')}


          def mmss(s):
              try:
                  m, sec = str(s).split(':')
                  return int(m) * 60 + int(sec)
              except Exception:
                  return 0


          def eff(code):
              ag, a, h, hg = code[0], int(code[1]), int(code[2]), code[3]
              if ag == '0':
                  a -= 1
              if hg == '0':
                  h -= 1
              return a, h


          def segments(d):
              ev = []
              for p in d.get('plays') or []:
                  pd = p.get('periodDescriptor') or {}
                  if pd.get('periodType') == 'SO':
                      continue
                  code = p.get('situationCode')
                  if not code or len(code) != 4:
                      continue
                  t = (pd.get('number', 1) - 1) * 1200 + mmss(p.get('timeInPeriod'))
                  ev.append((t, code))
              ev.sort(key=lambda x: x[0])
              segs = []
              for i, (t, c) in enumerate(ev):
                  s = 0 if i == 0 else (ev[i - 1][0] + t) / 2.0
                  e = 10 ** 9 if i == len(ev) - 1 else (t + ev[i + 1][0]) / 2.0
                  if e > s:
                      segs.append((s, e, c))
              return segs


          def add_toi(d, gid):
              out = {}
              try:
                  box = get('%s/gamecenter/%s/boxscore' % (BASE, gid))
                  bt = {}
                  for side in ('awayTeam', 'homeTeam'):
                      pbs = (box.get('playerByGameStats') or {}).get(side) or {}
                      for grp in ('forwards', 'defense', 'goalies'):
                          for pl in pbs.get(grp) or []:
                              if pl.get('playerId') and pl.get('toi'):
                                  bt[str(pl['playerId'])] = pl['toi']
                  if bt:
                      d['boxToi'] = bt
              except Exception as e:
                  print('Boxscore failed', gid, e)
              try:
                  sh = None
                  for u in ('https://api.nhle.com/stats/rest/en/shiftcharts?cayenneExp=gameId=%s' % gid,
                            'https://api.nhle.com/stats/rest/en/shiftcharts?cayenneExp=gameId%%3D%s&limit=-1' % gid,
                            'https://api.nhle.com/stats/rest/en/shiftcharts?cayenneExp=gameId=%s&limit=-1&lang=en' % gid):
                      try:
                          sh = get(u)
                          if sh and (sh.get('data') or []):
                              break
                      except urllib.error.HTTPError as he:
                          body = ''
                          try:
                              body = he.read().decode('utf-8', 'replace')[:160].replace('\n', ' ')
                          except Exception:
                              pass
                          print('Shift URL', u.split('?')[0][-30:], u.split('?')[1][:40] if '?' in u else '', 'HTTP', he.code, body)
                      except Exception as ex:
                          print('Shift URL error', u[:60], ex)
                  if sh is None:
                      raise RuntimeError('no shift endpoint worked')
                  rows = sh.get('data') or []
                  segs = segments(d)
                  aid = (d.get('awayTeam') or {}).get('id')
                  for r in rows:
                      if r.get('typeCode') != 517 or not r.get('playerId'):
                          continue
                      per = r.get('period') or 1
                      base = (per - 1) * 1200
                      s0 = base + mmss(r.get('startTime'))
                      e0 = base + mmss(r.get('endTime'))
                      if e0 <= s0:
                          continue
                      key = str(per) if per <= 3 else 'ot'
                      side_a = r.get('teamId') == aid
                      rec = out.setdefault(str(r['playerId']), {}).setdefault(key, [0, 0, 0])
                      for (a, b, c) in segs:
                          ov = min(b, e0) - max(a, s0)
                          if ov <= 0:
                              continue
                          ac, hc = eff(c)
                          mine, theirs = (ac, hc) if side_a else (hc, ac)
                          rec[0] += ov
                          if mine > theirs:
                              rec[1] += ov
                          elif mine < theirs:
                              rec[2] += ov
                  for pid in out:
                      for k in out[pid]:
                          out[pid][k] = [int(round(x)) for x in out[pid][k]]
                  if out:
                      d['toi'] = out
                  print('Shift rows', len(rows), 'players with TOI', len(out))
              except Exception as e:
                  print('Shifts failed', gid, e)


          def saved_final(path):
              try:
                  with open(path) as f:
                      return json.load(f).get('gameState') in ('OFF', 'FINAL')
              except Exception:
                  return False


          def start_dt(g):
              try:
                  return datetime.fromisoformat(g['start'].replace('Z', '+00:00'))
              except Exception:
                  return None


          import re, unicodedata

          DF_SLUG = {
              'ANA': 'anaheim-ducks', 'BOS': 'boston-bruins', 'BUF': 'buffalo-sabres', 'CGY': 'calgary-flames',
              'CAR': 'carolina-hurricanes', 'CHI': 'chicago-blackhawks', 'COL': 'colorado-avalanche',
              'CBJ': 'columbus-blue-jackets', 'DAL': 'dallas-stars', 'DET': 'detroit-red-wings',
              'EDM': 'edmonton-oilers', 'FLA': 'florida-panthers', 'LAK': 'los-angeles-kings',
              'MIN': 'minnesota-wild', 'MTL': 'montreal-canadiens', 'NSH': 'nashville-predators',
              'NJD': 'new-jersey-devils', 'NYI': 'new-york-islanders', 'NYR': 'new-york-rangers',
              'OTT': 'ottawa-senators', 'PHI': 'philadelphia-flyers', 'PIT': 'pittsburgh-penguins',
              'SJS': 'san-jose-sharks', 'SEA': 'seattle-kraken', 'STL': 'st-louis-blues',
              'TBL': 'tampa-bay-lightning', 'TOR': 'toronto-maple-leafs', 'UTA': 'utah-mammoth',
              'VAN': 'vancouver-canucks', 'VGK': 'vegas-golden-knights', 'WSH': 'washington-capitals',
              'WPG': 'winnipeg-jets'}
          LU_CACHE = {}
          LU_TZ = ZoneInfo('America/Toronto')
          SUFFIX = ('jr', 'sr', 'ii', 'iii', 'iv')


          def norm(s):
              s = unicodedata.normalize('NFKD', str(s or '')).encode('ascii', 'ignore').decode('ascii').lower()
              s = re.sub(r"[^a-z ]", ' ', s.replace('-', ' '))
              return ' '.join(w for w in s.split() if w not in SUFFIX)


          def get_text(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36', 'Accept': 'text/html,application/json'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.read().decode('utf-8', 'replace')


          def cached(key, fn):
              if key not in LU_CACHE:
                  try:
                      LU_CACHE[key] = fn()
                  except Exception as e:
                      print('Lineup fetch failed', key, str(e)[:100])
                      LU_CACHE[key] = None
              return LU_CACHE[key]


          def nm(x):
              if isinstance(x, dict):
                  return x.get('default') or ''
              return x or ''


          def team_stats(abbr):
              def f():
                  d = get('%s/club-stats/%s/now' % (BASE, abbr))
                  out = {}
                  for s in d.get('skaters') or []:
                      fo = s.get('faceoffWinPctg')
                      if fo is not None and fo <= 1:
                          fo = fo * 100
                      out[s['playerId']] = {'n': (nm(s.get('firstName')) + ' ' + nm(s.get('lastName'))).strip(), 'ps': s.get('positionCode'),
                                            'gp': s.get('gamesPlayed', 0), 'g': s.get('goals', 0), 'a': s.get('assists', 0), 'p': s.get('points', 0),
                                            'pm': s.get('plusMinus', 0), 'pim': s.get('penaltyMinutes', 0), 'sog': s.get('shots', 0),
                                            'toi': int(s.get('avgTimeOnIcePerGame') or 0), 'fo': round(fo, 1) if fo is not None else None}
                  for s in d.get('goalies') or []:
                      sv = s.get('savePercentage')
                      if sv is not None and sv > 1:
                          sv = sv / 100.0
                      out[s['playerId']] = {'n': (nm(s.get('firstName')) + ' ' + nm(s.get('lastName'))).strip(), 'ps': 'G',
                                            'gp': s.get('gamesPlayed', 0), 'gs': s.get('gamesStarted', 0), 'w': s.get('wins', 0), 'l': s.get('losses', 0),
                                            'o': s.get('overtimeLosses', 0), 'gaa': s.get('goalsAgainstAverage'), 'sv': sv, 'so': s.get('shutouts', 0)}
                  return out
              return cached('stats' + abbr, f) or {}


          def team_roster(abbr):
              def f():
                  d = get('%s/roster/%s/current' % (BASE, abbr))
                  out = {}
                  for grp in ('forwards', 'defensemen', 'goalies'):
                      for p in d.get(grp) or []:
                          out[p['id']] = {'n': (nm(p.get('firstName')) + ' ' + nm(p.get('lastName'))).strip(), 'u': p.get('sweaterNumber'), 'ps': p.get('positionCode')}
                  return out
              return cached('roster' + abbr, f) or {}


          def standings():
              def f():
                  d = get(BASE + '/standings/now')
                  out = {}
                  for t in d.get('standings') or []:
                      ab = nm(t.get('teamAbbrev'))
                      gp = t.get('gamesPlayed') or 0
                      out[ab] = {'rec': '%s-%s-%s' % (t.get('wins', 0), t.get('losses', 0), t.get('otLosses', 0)), 'pts': t.get('points', 0), 'gp': gp,
                                 'gf': t.get('goalFor', 0), 'ga': t.get('goalAgainst', 0),
                                 'streak': '%s%s' % (t.get('streakCode') or '', t.get('streakCount') or ''),
                                 'l10': '%s-%s-%s' % (t.get('l10Wins', 0), t.get('l10Losses', 0), t.get('l10OtLosses', 0))}
                  return out
              return cached('standings', f) or {}


          def walk(o, hits):
              if isinstance(o, dict):
                  if 'groupIdentifier' in o and ('name' in o or 'playerName' in o):
                      hits.append(o)
                  for v in o.values():
                      walk(v, hits)
              elif isinstance(o, list):
                  for v in o:
                      walk(v, hits)


          def find_key(o, key):
              if isinstance(o, dict):
                  if key in o and isinstance(o[key], str):
                      return o[key]
                  for v in o.values():
                      r = find_key(v, key)
                      if r:
                          return r
              elif isinstance(o, list):
                  for v in o:
                      r = find_key(v, key)
                      if r:
                          return r
              return None


          def df_fetch(abbr):
              slug = DF_SLUG.get(abbr)
              if not slug:
                  return None
              html = get_text('https://www.dailyfaceoff.com/teams/%s/line-combinations' % slug)
              m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', html, re.S)
              if not m:
                  raise RuntimeError('no NEXT_DATA')
              data = json.loads(m.group(1))
              hits = []
              walk(data, hits)
              if len(hits) < 15:
                  raise RuntimeError('too few players %d' % len(hits))
              pl = []
              seen = set()
              for h in hits:
                  name = h.get('name') or h.get('playerName')
                  grp = str(h.get('groupIdentifier') or '').lower()
                  key = (norm(name), grp)
                  if key in seen:
                      continue
                  seen.add(key)
                  inj = h.get('injuryStatus') or h.get('injury') or None
                  if isinstance(inj, dict):
                      inj = inj.get('status') or inj.get('name') or 'Injured'
                  pl.append({'name': name, 'grp': grp, 'pos': str(h.get('positionIdentifier') or '').lower(), 'inj': inj or None})
              upd = find_key(data, 'updatedAt')
              return {'players': pl, 'updatedAt': upd}


          def resolve(name, roster, stats):
              k = norm(name)
              pool = {}
              for pid, r in roster.items():
                  pool[pid] = r['n']
              for pid, r in stats.items():
                  pool.setdefault(pid, r['n'])
              for pid, n in pool.items():
                  if norm(n) == k:
                      return pid
              parts = k.split()
              if not parts:
                  return None
              last = parts[-1]
              c = [pid for pid, n in pool.items() if norm(n).split() and norm(n).split()[-1] == last]
              if len(c) == 1:
                  return c[0]
              c2 = [pid for pid in c if norm(pool[pid]).startswith(parts[0][:1])]
              if len(c2) == 1:
                  return c2[0]
              return None


          POS_ORDER = {'lw': 0, 'l': 0, 'c': 1, 'rw': 2, 'r': 2, 'ld': 0, 'rd': 1}


          def slot_sort(lst):
              return sorted(lst, key=lambda p: POS_ORDER.get(p['pos'], 5))


          def from_df(abbr, df, roster, stats):
              ref = {}
              def idof(p):
                  pid = resolve(p['name'], roster, stats)
                  if pid is None:
                      ref['nm_' + norm(p['name'])] = p['name']
                      return 'n:' + p['name']
                  return pid
              by = {}
              for p in df['players']:
                  by.setdefault(p['grp'], []).append(p)
              def grp(g, n):
                  lst = slot_sort(by.get(g, []))
                  ids = [idof(p) for p in lst][:n]
                  while len(ids) < n:
                      ids.append(None)
                  return ids
              F = [grp('f%d' % i, 3) for i in (1, 2, 3, 4)]
              D = [grp('d%d' % i, 2) for i in (1, 2, 3)]
              G = [idof(p) for p in by.get('g', [])][:2]
              PP = [[idof(p) for p in by.get('pp%d' % i, [])] for i in (1, 2)]
              PK = [[idof(p) for p in by.get('pk%d' % i, [])] for i in (1, 2)]
              out = []
              for g, lst in by.items():
                  for p in lst:
                      if g in ('ir', 'ltir', 'injured', 'injured-reserve') or (p['inj'] and g not in ('f1', 'f2', 'f3', 'f4', 'd1', 'd2', 'd3', 'g')):
                          if not any(norm(o['name']) == norm(p['name']) for o in out):
                              out.append({'id': resolve(p['name'], roster, stats), 'name': p['name'], 'st': str(p['inj'] or 'IR')})
              scr = []
              for g in ('scratches', 'scratch', 'healthy-scratches'):
                  for p in by.get(g, []):
                      scr.append({'id': resolve(p['name'], roster, stats), 'name': p['name']})
              return {'F': F, 'D': D, 'G': G, 'PP': PP, 'PK': PK, 'out': out, 'scr': scr, 'src': 'Daily Faceoff', 'asOf': df.get('updatedAt')}


          def from_lastgame(abbr):
              sched = get('%s/club-schedule-season/%s/now' % (BASE, abbr))
              done = [g for g in sched.get('games') or [] if g.get('gameState') in ('OFF', 'FINAL') and g.get('gameType') in (2, 3)]
              if not done:
                  return None
              last = sorted(done, key=lambda g: g.get('startTimeUTC') or '')[-1]
              box = get('%s/gamecenter/%s/boxscore' % (BASE, last['id']))
              side = 'awayTeam' if nm((box.get('awayTeam') or {}).get('abbrev')) == abbr else 'homeTeam'
              pb = (box.get('playerByGameStats') or {}).get(side) or {}
              def toi(p):
                  return mmss(p.get('toi'))
              fw = sorted(pb.get('forwards') or [], key=toi, reverse=True)[:12]
              df_ = sorted(pb.get('defense') or [], key=toi, reverse=True)[:6]
              gl = sorted(pb.get('goalies') or [], key=toi, reverse=True)
              def posrank(p):
                  return {'L': 0, 'C': 1, 'R': 2}.get(p.get('position'), 3)
              F = []
              for i in range(0, 12, 3):
                  ch = sorted(fw[i:i + 3], key=posrank)
                  ids = [p['playerId'] for p in ch]
                  while len(ids) < 3:
                      ids.append(None)
                  F.append(ids)
              D = []
              for i in range(0, 6, 2):
                  ids = [p['playerId'] for p in df_[i:i + 2]]
                  while len(ids) < 2:
                      ids.append(None)
                  D.append(ids)
              return {'F': F, 'D': D, 'G': [p['playerId'] for p in gl][:2], 'PP': [[], []], 'PK': [[], []], 'out': [], 'scr': [],
                      'src': 'last game (%s)' % (last.get('gameDate') or ''), 'asOf': None}


          def project_team(abbr):
              roster = team_roster(abbr)
              stats = team_stats(abbr)
              t = None
              try:
                  df = df_fetch(abbr)
                  if df:
                      t = from_df(abbr, df, roster, stats)
              except Exception as e:
                  print('Daily Faceoff failed', abbr, str(e)[:100])
              if t is None:
                  try:
                      t = from_lastgame(abbr)
                  except Exception as e:
                      print('Last game fallback failed', abbr, str(e)[:100])
              return t


          def ids_in(t):
              s = set()
              for ln in t['F'] + t['D']:
                  s.update(x for x in ln if x is not None)
              s.update(x for x in t['G'] if x is not None)
              for u in t['PP'] + t['PK']:
                  s.update(x for x in u if x is not None)
              for o in t['out'] + t['scr']:
                  if o.get('id') is not None:
                      s.add(o['id'])
              return set(x for x in s if not isinstance(x, str))


          def finish_team(abbr, t, st, stats, roster):
              players = {}
              for pid in ids_in(t):
                  r = stats.get(pid)
                  ro = roster.get(pid) or {}
                  if r:
                      q = dict(r)
                  elif ro:
                      q = {'n': ro['n'], 'ps': ro.get('ps'), 'gp': 0}
                  else:
                      continue
                  if ro.get('u') is not None:
                      q['u'] = ro['u']
                  players[str(pid)] = q
              attach_info(players)
              t['players'] = players
              t['team'] = st.get(abbr)
              return t


          def season_rows(d):
              """NHL regular season rows grouped by season, newest first, last 3 kept."""
              rows = {}
              goalie = (d.get('position') == 'G')
              for r in d.get('seasonTotals') or []:
                  if r.get('leagueAbbrev') != 'NHL' or r.get('gameTypeId') != 2:
                      continue
                  k = r.get('season')
                  x = rows.setdefault(k, {'gp': 0, 'g': 0, 'a': 0, 'p': 0, 'pm': 0, 'pim': 0, 'w': 0, 'l': 0, 'o': 0, 'so': 0, 'gaa': None, 'sv': None, '_m': -1})
                  gp = r.get('gamesPlayed') or 0
                  x['gp'] += gp
                  for a, b in (('g', 'goals'), ('a', 'assists'), ('p', 'points'), ('pm', 'plusMinus'), ('pim', 'pim'), ('w', 'wins'), ('l', 'losses'), ('o', 'otLosses'), ('so', 'shutouts')):
                      x[a] += r.get(b) or 0
                  if goalie and gp > x['_m']:
                      x['_m'] = gp
                      x['gaa'] = r.get('goalsAgainstAvg')
                      x['sv'] = r.get('savePctg')
              out = []
              for k in sorted(rows.keys(), reverse=True)[:3]:
                  x = rows[k]
                  x.pop('_m', None)
                  x['s'] = k
                  out.append(x)
              return out


          def player_info(pid):
              path = 'players/%s.json' % pid
              try:
                  with open(path) as f:
                      old = json.load(f)
                  at = datetime.fromisoformat(old['at'].replace('Z', '+00:00'))
                  if (datetime.now(timezone.utc) - at).total_seconds() < 20 * 3600:
                      return old
              except Exception:
                  old = None
              try:
                  d = get('%s/player/%s/landing' % (BASE, pid))
                  dr = d.get('draftDetails') or {}
                  bp = nm(d.get('birthCity'))
                  reg = nm(d.get('birthStateProvince')) or d.get('birthCountry') or ''
                  if bp and reg:
                      bp = bp + ', ' + reg
                  car = ((d.get('careerTotals') or {}).get('regularSeason')) or {}
                  info = {'ht': d.get('heightInInches'), 'wt': d.get('weightInPounds'), 'sh': d.get('shootsCatches'), 'dob': d.get('birthDate'), 'bp': bp,
                          'dr': ([dr.get('year'), dr.get('round'), dr.get('overallPick'), dr.get('teamAbbrev')] if dr else None),
                          'ss': season_rows(d),
                          'car': {'gp': car.get('gamesPlayed', 0), 'g': car.get('goals', 0), 'a': car.get('assists', 0), 'p': car.get('points', 0), 'pm': car.get('plusMinus', 0),
                                  'pim': car.get('pim', 0), 'w': car.get('wins', 0), 'l': car.get('losses', 0), 'o': car.get('otLosses', 0), 'so': car.get('shutouts', 0),
                                  'gaa': car.get('goalsAgainstAvg'), 'sv': car.get('savePctg')},
                          'at': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}
                  os.makedirs('players', exist_ok=True)
                  with open(path, 'w') as f:
                      json.dump(info, f, separators=(',', ':'))
                  return info
              except Exception as e:
                  print('Player info failed', pid, str(e)[:80])
                  return old


          def attach_info(players):
              ids = [k for k in players.keys()]
              def one(k):
                  return k, player_info(int(k))
              with ThreadPoolExecutor(max_workers=6) as ex:
                  for k, info in ex.map(one, ids):
                      if info:
                          players[k]['bio'] = info


          def apply_dressed(t, dressed):
              """dressed: {pid: {'n','ps','u'}} for this team from the real game roster."""
              changes = []
              placed = set()
              absent = []
              byname = {norm(r['n']): p for p, r in dressed.items()}
              def fix(x):
                  if isinstance(x, str) and x.startswith('n:'):
                      return byname.get(norm(x[2:]), x)
                  return x
              t['F'] = [[fix(x) for x in ln] for ln in t['F']]
              t['D'] = [[fix(x) for x in ln] for ln in t['D']]
              t['G'] = [fix(x) for x in t['G']]
              t['PP'] = [[fix(x) for x in u] for u in t['PP']]
              t['PK'] = [[fix(x) for x in u] for u in t['PK']]
              def pname(x):
                  if isinstance(x, str):
                      return x[2:] if x.startswith('n:') else x
                  return (t.get('players', {}).get(str(x)) or {}).get('n') or str(x)
              def chk(x):
                  if x is None or isinstance(x, str):
                      return None
                  return x if x in dressed else None
              for kind, grid in (('F', t['F']), ('D', t['D'])):
                  for ln in grid:
                      for i, x in enumerate(ln):
                          if x is not None and not isinstance(x, str) and x in dressed:
                              placed.add(x)
                          else:
                              if x is not None:
                                  absent.append(x)
                              ln[i] = None
              gl = [x for x in t['G'] if x in dressed]
              placed.update(gl)
              for x in t['G']:
                  if x is not None and x not in dressed:
                      absent.append(x)
              t['G'] = gl
              spare_f = [p for p, r in dressed.items() if p not in placed and r.get('ps') in ('C', 'L', 'R', 'F')]
              spare_d = [p for p, r in dressed.items() if p not in placed and r.get('ps') == 'D']
              spare_g = [p for p, r in dressed.items() if p not in placed and r.get('ps') == 'G']
              for ln in t['F']:
                  for i, x in enumerate(ln):
                      if x is None and spare_f:
                          ln[i] = spare_f.pop(0)
                          changes.append('IN: ' + dressed[ln[i]]['n'])
              for ln in t['D']:
                  for i, x in enumerate(ln):
                      if x is None and spare_d:
                          ln[i] = spare_d.pop(0)
                          changes.append('IN: ' + dressed[ln[i]]['n'])
              while len(t['G']) < 2 and spare_g:
                  g = spare_g.pop(0)
                  t['G'].append(g)
              t['extra'] = spare_f + spare_d
              t['PP'] = [[x for x in u if x in dressed] for u in t['PP']]
              t['PK'] = [[x for x in u if x in dressed] for u in t['PK']]
              for a in absent:
                  changes.insert(0, 'OUT: ' + pname(a))
              t['changes'] = changes
              t['confirmed'] = True
              return t


          def dressed_from_pbp(g):
              d = get('%s/gamecenter/%s/play-by-play' % (BASE, g['id']))
              spots = d.get('rosterSpots') or []
              if len(spots) < 30:
                  return None
              aid = (d.get('awayTeam') or {}).get('id')
              out = {g['away']: {}, g['home']: {}}
              for r in spots:
                  ab = g['away'] if r.get('teamId') == aid else g['home']
                  pc = r.get('positionCode')
                  out[ab][r['playerId']] = {'n': (nm(r.get('firstName')) + ' ' + nm(r.get('lastName'))).strip(), 'ps': pc, 'u': r.get('sweaterNumber')}
              return out


          def stage_times(sd):
              ls = sd.astimezone(LU_TZ)
              t3 = sd - timedelta(minutes=30)
              t2 = min(ls.replace(hour=13, minute=0, second=0, microsecond=0), ls - timedelta(hours=6))
              t2 = max(t2, ls.replace(hour=10, minute=30, second=0, microsecond=0))
              t2 = min(t2, t3 - timedelta(minutes=30))
              t1 = min(ls.replace(hour=7, minute=0, second=0, microsecond=0), t2 - timedelta(hours=1))
              t4 = sd + timedelta(minutes=3)
              return {1: t1, 2: t2, 3: t3, 4: t4}


          def lineup_work(g, now, forced=None):
              """Returns the stage to run for this game, or None."""
              sd = start_dt(g)
              if sd is None:
                  return None
              path = 'lineups/%s.json' % g['id']
              done = 0
              try:
                  with open(path) as f:
                      done = max([int(k) for k in (json.load(f).get('stages') or {}).keys()] or [0])
              except Exception:
                  pass
              ts = stage_times(sd)
              due = [k for k in (4, 3, 2, 1) if ts[k] <= now]
              if not due or due[0] <= done:
                  return None
              return due[0]


          def build_lineup(g, stage, now):
              path = 'lineups/%s.json' % g['id']
              old = {}
              try:
                  with open(path) as f:
                      old = json.load(f)
              except Exception:
                  pass
              st = standings()
              teams = {}
              dr = None
              if stage == 4:
                  dr = dressed_from_pbp(g)
                  if not dr:
                      print('Lineup stage 4 waiting for roster', g['id'])
                      return False
              for ab in (g['away'], g['home']):
                  t = (old.get('teams') or {}).get(ab)
                  if t is None:
                      t = project_team(ab)
                      if t is None:
                          print('No lineup for', ab)
                          return False
                      t = finish_team(ab, t, st, team_stats(ab), team_roster(ab))
                  elif stage < 4:
                      t2 = project_team(ab)
                      if t2 is not None:
                          t = finish_team(ab, t2, st, team_stats(ab), team_roster(ab))
                  if stage == 4:
                      apply_dressed(t, dr[ab])
                      stats = team_stats(ab)
                      for pid, r in dr[ab].items():
                          q = t['players'].get(str(pid))
                          if q is None:
                              q = dict(stats.get(pid) or {'n': r['n'], 'ps': r['ps'], 'gp': 0})
                              t['players'][str(pid)] = q
                          if r.get('u') is not None:
                              q['u'] = r['u']
                          if 'bio' not in q:
                              inf = player_info(pid)
                              if inf:
                                  q['bio'] = inf
                  teams[ab] = t
              status = 'confirmed' if stage == 4 else 'projected'
              stages = dict(old.get('stages') or {})
              stages[str(stage)] = now.strftime('%Y-%m-%dT%H:%M:%SZ')
              obj = {'id': g['id'], 'away': g['away'], 'home': g['home'], 'status': status, 'stage': stage,
                     'builtAt': now.strftime('%Y-%m-%dT%H:%M:%SZ'), 'stages': stages, 'teams': teams}
              os.makedirs('lineups', exist_ok=True)
              with open(path, 'w') as f:
                  json.dump(obj, f, separators=(',', ':'))
              print('Lineup built', g['id'], g['away'], g['home'], 'stage', stage, status)
              return True


          def build_lineups(games, now, today):
              LU_CACHE.clear()
              work = []
              for g in games:
                  if g.get('date') != today or g.get('state') in ('OFF', 'FINAL'):
                      continue
                  try:
                      s = lineup_work(g, now)
                  except Exception as e:
                      print('Lineup plan failed', g.get('id'), e)
                      continue
                  if s:
                      work.append((g, s))
              if not work:
                  return
              print('Lineups to build', [(g['id'], s) for g, s in work])
              def one(item):
                  g, s = item
                  try:
                      return build_lineup(g, s, now)
                  except Exception as e:
                      print('Lineup failed', g['id'], str(e)[:150])
                      return False
              with ThreadPoolExecutor(max_workers=WORKERS) as ex:
                  list(ex.map(one, work))


          def cycle():
              t0 = time.time()
              now = datetime.now(timezone.utc)
              stamp = now.strftime('%Y-%m-%dT%H:%M:%SZ')
              local = datetime.now(ZoneInfo('America/Toronto'))
              today = local.strftime('%Y-%m-%d')
              dates = [(local + timedelta(days=k)).strftime('%Y-%m-%d') for k in (-1, 0)]
              print('Cycle', stamp, 'Toronto date', today)

              byid = {}
              window_ids = set()

              def fetch_score(ds):
                  try:
                      return ds, get(BASE + '/score/' + ds)
                  except Exception as e:
                      print('Score fetch failed', ds, e)
                      return ds, None

              def fetch_club():
                  try:
                      return get(BASE + '/club-schedule-season/' + TEAM + '/now')
                  except Exception as e:
                      print('Club schedule failed', e)
                      return None

              with ThreadPoolExecutor(max_workers=WORKERS) as ex:
                  club_f = ex.submit(fetch_club)
                  score_res = list(ex.map(fetch_score, dates))
                  sched = club_f.result()
              for ds, sc in score_res:
                  if not sc:
                      continue
                  for g in sc.get('games') or []:
                      if g.get('id'):
                          byid[g['id']] = mk(g, ds)
                          window_ids.add(g['id'])
              for g in ((sched or {}).get('games') or []):
                  m = mk(g)
                  if not m['id'] or m['id'] in window_ids:
                      continue
                  if m['state'] in ('OFF', 'FINAL'):
                      byid[m['id']] = m

              if not byid:
                  print('No games found this cycle')
                  return stamp, False

              games = sorted(byid.values(), key=lambda g: (g['date'] or '', g['start'] or ''))
              os.makedirs('data', exist_ok=True)
              try:
                  build_lineups(games, now, today)
              except Exception as e:
                  print('Lineups step failed', e)

              todo = []
              new_count = 0
              active = False
              for g in games:
                  path = 'data/%s.json' % g['id']
                  sd = start_dt(g)
                  live = g['state'] in ('LIVE', 'CRIT')
                  final = g['state'] in ('OFF', 'FINAL')
                  if live:
                      active = True
                  elif not final and sd is not None and now - timedelta(hours=1) <= sd <= now + timedelta(minutes=20):
                      active = True
                  if saved_final(path):
                      continue
                  soon = sd is not None and now - timedelta(hours=1) <= sd <= now + timedelta(hours=2)
                  if live or soon or g['date'] == today:
                      todo.append((g, path))
                  elif final and new_count < MAX_NEW:
                      todo.append((g, path))
                      new_count += 1

              def process(item):
                  g, path = item
                  try:
                      d = get('%s/gamecenter/%s/play-by-play' % (BASE, g['id']))
                      now_s = datetime.now(timezone.utc)
                      d['fetchedAt'] = now_s.strftime('%Y-%m-%dT%H:%M:%SZ')
                      try:
                          with open('lineups/%s.json' % g['id']) as lf:
                              d['lineup'] = json.load(lf)
                      except Exception:
                          pass
                      if g['state'] not in ('FUT', 'PRE'):
                          reuse = False
                          try:
                              with open(path) as f:
                                  old = json.load(f)
                              ta = old.get('toiAt')
                              if ta and (now_s - datetime.fromisoformat(ta.replace('Z', '+00:00'))).total_seconds() < TOI_EVERY \
                                      and g['state'] in ('LIVE', 'CRIT') and (old.get('toi') or old.get('boxToi')):
                                  if old.get('toi'):
                                      d['toi'] = old['toi']
                                  if old.get('boxToi'):
                                      d['boxToi'] = old['boxToi']
                                  d['toiAt'] = ta
                                  reuse = True
                          except Exception:
                              pass
                          if not reuse:
                              add_toi(d, g['id'])
                              d['toiAt'] = d['fetchedAt']
                      with open(path, 'w') as f:
                          json.dump(d, f, separators=(',', ':'))
                      return True
                  except Exception as e:
                      print('Failed', g['id'], e)
                      return False

              with ThreadPoolExecutor(max_workers=WORKERS) as ex:
                  fetched = sum(1 for ok in ex.map(process, todo) if ok)
              print('Fetched', fetched, 'of', len(todo), 'active', active, 'took', round(time.time() - t0, 1), 's')

              keep = set(str(g['id']) for g in games)
              for n in os.listdir('data'):
                  if n.endswith('.json') and n[:-5] not in keep:
                      os.remove(os.path.join('data', n))

              if os.path.isdir('lineups'):
                  for n in os.listdir('lineups'):
                      if n.endswith('.json') and (n[:-5] not in keep or saved_final('data/' + n)):
                          os.remove(os.path.join('lineups', n))

              saved = sorted(int(n[:-5]) for n in os.listdir('data') if n.endswith('.json') and n[:-5].isdigit())
              with open('games.json', 'w') as f:
                  json.dump({'team': TEAM, 'today': today, 'saved': saved, 'games': games,
                             'updatedAt': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}, f, separators=(',', ':'))
              return stamp, active


          setup()
          chain = False
          n = 0
          while True:
              n += 1
              stamp, active = cycle()
              try:
                  pushed = publish(stamp)
                  print('Published' if pushed else 'No change', 'cycle', n, flush=True)
              except Exception as e:
                  print('Publish failed', e)
              if not active:
                  break
              if time.time() - START > BUDGET:
                  chain = True
                  break
              time.sleep(PAUSE)

          out = os.environ.get('GITHUB_OUTPUT')
          if out:
              with open(out, 'a') as f:
                  f.write('chain=%s\n' % ('true' if chain else 'false'))
          print('Done after', n, 'cycles, chain next run:', chain)
          PY
      - name: Start the next run if games are still on
        if: steps.fetch.outputs.chain == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --repo ${{ github.repository }} --ref main
