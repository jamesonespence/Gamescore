name: Update game data
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch NHL play-by-play
        run: |
          TODAY=$(TZ=America/Toronto date +%F)
          ID=$(curl -fsS https://api-web.nhle.com/v1/club-schedule-season/TOR/now | jq -r --arg d "$TODAY" '[.games[] | select(.gameDate==$d)][0].id // empty')
          if [ -z "$ID" ]; then echo "No Leafs game today"; exit 0; fi
          curl -fsS "https://api-web.nhle.com/v1/gamecenter/$ID/play-by-play" -o raw.json
          jq --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '. + {fetchedAt: $t}' raw.json > data.json
          rm raw.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update game data" && git push)

