name: Update game data
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch NHL play-by-play
        run: |
          TODAY=$(TZ=America/Toronto date +%F)
          echo "Today is $TODAY"
          curl -fsS https://api-web.nhle.com/v1/club-schedule-season/TOR/now -o sched.json
          ID=$(jq -r --arg d "$TODAY" '([.games[] | select(.gameState=="LIVE" or .gameState=="CRIT")][0] // [.games[] | select(.gameDate==$d)][0] // ([.games[] | select(.gameState=="OFF" or .gameState=="FINAL")] | last) // {}) | .id // empty' sched.json)
          echo "Game id: $ID"
          if [ -z "$ID" ]; then echo "No game found"; exit 1; fi
          curl -fsS "https://api-web.nhle.com/v1/gamecenter/$ID/play-by-play" -o raw.json
          jq --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '. + {fetchedAt: $t}' raw.json > data.json
          rm raw.json sched.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update game data" && git push)
