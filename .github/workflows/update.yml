name: Update game data
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch NHL data
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          TEAM = 'TOR'
          BASE = 'https://api-web.nhle.com/v1'
          MAX_NEW = 30

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (gamescore)'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode('utf-8'))

          def mk(g, ds=None):
              a = g.get('awayTeam') or {}
              h = g.get('homeTeam') or {}
              return {'id': g.get('id'), 'date': g.get('gameDate') or ds, 'start': g.get('startTimeUTC'),
                      'away': a.get('abbrev'), 'home': h.get('abbrev'), 'state': g.get('gameState'),
                      'as': a.get('score'), 'hs': h.get('score')}

          now = datetime.now(timezone.utc)
          stamp = now.strftime('%Y-%m-%dT%H:%M:%SZ')
          local = datetime.now(ZoneInfo('America/Toronto'))
          today = local.strftime('%Y-%m-%d')
          dates = [(local + timedelta(days=k)).strftime('%Y-%m-%d') for k in (-1, 0)]
          print('Now', stamp, 'Toronto date', today, 'window', dates)

          byid = {}
          window_ids = set()
          for ds in dates:
              try:
                  sc = get(BASE + '/score/' + ds)
                  n = 0
                  for g in sc.get('games') or []:
                      if g.get('id'):
                          byid[g['id']] = mk(g, ds)
                          window_ids.add(g['id'])
                          n += 1
                  print('Score', ds, 'games', n)
              except Exception as e:
                  print('Score fetch failed', ds, e)

          try:
              sched = get(BASE + '/club-schedule-season/' + TEAM + '/now')
              n = 0
              for g in sched.get('games') or []:
                  m = mk(g)
                  if not m['id']:
                      continue
                  if m['id'] in window_ids:
                      continue
                  if m['state'] in ('OFF', 'FINAL'):
                      byid[m['id']] = m
                      n += 1
              print('Club history games', n)
          except Exception as e:
              print('Club schedule failed', e)

          if not byid:
              print('No games found at all')
              sys.exit(1)

          games = sorted(byid.values(), key=lambda g: (g['date'] or '', g['start'] or ''))
          os.makedirs('data', exist_ok=True)

          def saved_final(path):
              try:
                  with open(path) as f:
                      return json.load(f).get('gameState') in ('OFF', 'FINAL')
              except Exception:
                  return False

          def start_dt(g):
              try:
                  return datetime.fromisoformat(g['start'].replace('Z', '+00:00'))
              except Exception:
                  return None

          todo = []
          new_count = 0
          for g in games:
              path = 'data/%s.json' % g['id']
              if saved_final(path):
                  continue
              sd = start_dt(g)
              soon = sd is not None and now - timedelta(hours=1) <= sd <= now + timedelta(hours=2)
              live = g['state'] in ('LIVE', 'CRIT')
              final = g['state'] in ('OFF', 'FINAL')
              if live or soon or g['date'] == today:
                  todo.append((g, path))
              elif final and new_count < MAX_NEW:
                  todo.append((g, path))
                  new_count += 1

          fetched = 0
          for g, path in todo:
              try:
                  d = get('%s/gamecenter/%s/play-by-play' % (BASE, g['id']))
                  d['fetchedAt'] = stamp
                  with open(path, 'w') as f:
                      json.dump(d, f, separators=(',', ':'))
                  fetched += 1
              except Exception as e:
                  print('Failed', g['id'], e)
          print('Fetched', fetched, 'of', len(todo))

          keep = set(str(g['id']) for g in games)
          removed = 0
          for n in os.listdir('data'):
              if n.endswith('.json') and n[:-5] not in keep:
                  os.remove(os.path.join('data', n))
                  removed += 1
          print('Removed old copies:', removed)

          saved = sorted(int(n[:-5]) for n in os.listdir('data') if n.endswith('.json') and n[:-5].isdigit())
          with open('games.json', 'w') as f:
              json.dump({'team': TEAM, 'today': today, 'saved': saved, 'games': games}, f, separators=(',', ':'))
          print('Games listed:', len(games), 'Saved copies:', len(saved))
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A data games.json
          git diff --cached --quiet || (git commit -m "Update game data" && git push)
