name: Update game data
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch NHL data
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          TEAM = 'TOR'
          BASE = 'https://api-web.nhle.com/v1'
          MAX_NEW = 20

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (gamescore)'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode('utf-8'))

          now = datetime.now(timezone.utc)
          stamp = now.strftime('%Y-%m-%dT%H:%M:%SZ')
          today = datetime.now(ZoneInfo('America/Toronto')).strftime('%Y-%m-%d')
          print('Now', stamp, 'Toronto date', today)

          sched = get(BASE + '/club-schedule-season/' + TEAM + '/now')
          raw = sched.get('games') or []
          print('Schedule keys:', list(sched.keys()), 'games:', len(raw))
          if not raw:
              print('No games in the schedule response')
              sys.exit(1)

          games = []
          for g in raw:
              a = g.get('awayTeam') or {}
              h = g.get('homeTeam') or {}
              games.append({'id': g.get('id'), 'date': g.get('gameDate'), 'start': g.get('startTimeUTC'),
                            'away': a.get('abbrev'), 'home': h.get('abbrev'), 'state': g.get('gameState'),
                            'as': a.get('score'), 'hs': h.get('score')})

          os.makedirs('data', exist_ok=True)

          def saved_final(path):
              try:
                  with open(path) as f:
                      return json.load(f).get('gameState') in ('OFF', 'FINAL')
              except Exception:
                  return False

          def start_dt(g):
              try:
                  return datetime.fromisoformat(g['start'].replace('Z', '+00:00'))
              except Exception:
                  return None

          todo = []
          new_count = 0
          for g in games:
              path = 'data/%s.json' % g['id']
              if saved_final(path):
                  continue
              sd = start_dt(g)
              soon = sd is not None and now - timedelta(hours=1) <= sd <= now + timedelta(hours=2)
              live = g['state'] in ('LIVE', 'CRIT')
              final = g['state'] in ('OFF', 'FINAL')
              if live or soon or g['date'] == today:
                  todo.append((g, path))
              elif final and new_count < MAX_NEW:
                  todo.append((g, path))
                  new_count += 1

          fetched = 0
          for g, path in todo:
              try:
                  d = get('%s/gamecenter/%s/play-by-play' % (BASE, g['id']))
                  d['fetchedAt'] = stamp
                  with open(path, 'w') as f:
                      json.dump(d, f, separators=(',', ':'))
                  fetched += 1
              except Exception as e:
                  print('Failed', g['id'], e)
          print('Fetched', fetched, 'of', len(todo))

          saved = sorted(int(n[:-5]) for n in os.listdir('data') if n.endswith('.json') and n[:-5].isdigit())
          with open('games.json', 'w') as f:
              json.dump({'team': TEAM, 'today': today, 'saved': saved, 'games': games}, f, separators=(',', ':'))
          print('Saved copies:', len(saved))
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data games.json
          git diff --cached --quiet || (git commit -m "Update game data" && git push)
