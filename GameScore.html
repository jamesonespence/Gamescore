<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live Game Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@600;800&display=swap">
<style>
/* Layout: scoreboard, then key stats as paired bars, then advanced stats. Away team uses --a, home team uses --b. */
:root{
  --bg:#f1f4f8; --surface:#ffffff; --fg:#0e1a2c; --muted:#58687e; --line:#d8dfe9;
  --a:#1b4f9c; --b:#c8102e; --track:#e6ebf2; --chip:#0e1a2c; --chip-fg:#ffffff; --dot:#f5a524; --err:#8a1c1c; --err-bg:#fde8e8;
  --f-disp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'Barlow','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a111e; --surface:#121b2d; --fg:#e8eef8; --muted:#92a3bb; --line:#233049;
    --a:#5b9bff; --b:#ff5a6e; --track:#1e2a42; --chip:#e8eef8; --chip-fg:#0a111e; --err:#ffb4b4; --err-bg:#3a1a1f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a111e; --surface:#121b2d; --fg:#e8eef8; --muted:#92a3bb; --line:#233049;
  --a:#5b9bff; --b:#ff5a6e; --track:#1e2a42; --chip:#e8eef8; --chip-fg:#0a111e; --err:#ffb4b4; --err-bg:#3a1a1f;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{
  background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.45;
  margin:0; padding-block:16px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
h2{font-size:22px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.sub{color:var(--muted);font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--chip);color:var(--chip-fg);
  font-family:var(--f-disp);font-weight:800;letter-spacing:.08em;font-size:14px;padding:4px 10px;border-radius:4px;text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dot)}
@media (prefers-reduced-motion:no-preference){.live .dot{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.25}}
button.btn{font:inherit;font-size:13px;font-weight:600;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer}
button.btn:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.err{background:var(--err-bg);color:var(--err);border:1px solid var(--err);border-radius:6px;padding:10px 12px;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.team{display:flex;flex-direction:column;min-width:0}
.team.r{align-items:flex-end;text-align:right}
.abbr{font-family:var(--f-disp);font-weight:800;font-size:18px;letter-spacing:.1em}
.ta{color:var(--a)} .tb{color:var(--b)}
.num{font-family:var(--f-disp);font-weight:800;font-size:clamp(64px,22vw,104px);line-height:.95;font-variant-numeric:tabular-nums;color:var(--fg)}
.tname{font-size:13px;color:var(--muted)}
.clock{text-align:center;display:flex;flex-direction:column;gap:2px}
.clock .t{font-family:var(--f-disp);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.clock .p{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bottom{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-weight:500}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);font-size:14px}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.plays{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.plays li{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start}
.badge{font-family:var(--f-disp);font-weight:800;letter-spacing:.08em;text-align:center;padding:2px 0;border-radius:4px;color:#fff;font-size:14px}
.badge.a{background:var(--a)} .badge.b{background:var(--b)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge{color:#0a111e}}
:root[data-theme="dark"] .badge{color:#0a111e}
.stat{display:flex;flex-direction:column;gap:5px;padding:9px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.sr{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:baseline}
.sr .v{font-family:var(--f-disp);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.sr .v.l{text-align:left} .sr .v.r{text-align:right}
.sr .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.sr .v.lead.l{color:var(--a)} .sr .v.lead.r{color:var(--b)}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--track);gap:2px}
.bar i{display:block;height:100%}
.bar .a{background:var(--a)} .bar .b{background:var(--b)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:620px){.cols{grid-template-columns:1fr}}
.cols h3{font-size:16px;letter-spacing:.08em;margin:0 0 6px;text-transform:uppercase}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.read{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.read li{padding-left:12px;border-left:3px solid var(--line)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:4px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.h3m{font-size:16px;margin-top:18px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.pickrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pickrow select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px;min-width:0;max-width:100%;flex:1 1 220px}
.pickrow select:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.nav{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;gap:6px}
.segb{flex:1 1 0;min-width:0;font:inherit;font-weight:600;font-size:15px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 4px;min-height:44px;cursor:pointer}
.segb.on{background:var(--chip);color:var(--chip-fg);border-color:var(--chip)}
.segb:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.seg.sm .segb{min-height:38px;font-size:14px;padding:6px 4px}
.pgrp{margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}
.pgrp:first-of-type{border-top:0;padding-top:0}
.ph{font-size:18px;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.pscore{font-size:15px;letter-spacing:.04em;color:var(--muted)}
.subh{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 4px;font-weight:600}
tr.grp td{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--track);text-align:left;font-weight:600}
td.tot{font-weight:600}
.gloss summary{cursor:pointer;font-family:var(--f-disp);font-weight:800;font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.gloss dt{font-weight:600;margin-top:10px}
.gloss dd{margin:2px 0 0;color:var(--muted);font-size:14px}
table.ls th,table.ls td{padding:7px 2px;font-size:14px;text-align:center}
table.ls th{letter-spacing:.02em}
table.ls th:first-child,table.ls td:first-child{text-align:left;padding-left:6px}
table.ls tr.g1 th{border-bottom:0;padding-bottom:0}
table.ls th.gl{text-align:center;color:var(--fg);font-family:var(--f-disp);font-size:14px;letter-spacing:.1em}
table.ls .gr{border-left:1px solid var(--line)}
table.ls td.tot{background:var(--track)}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.pn{font-family:var(--f-disp);font-weight:800;font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.pscore i{font-style:normal;color:var(--muted)}
.ev{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ev li{display:grid;grid-template-columns:46px 44px 1fr;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.ev li:last-child{border-bottom:0}
.ev .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;padding-top:2px}
.ev .tx{display:flex;flex-direction:column;min-width:0}
.ev .l1{overflow-wrap:anywhere}
.ev .l2{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.ev .tag{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-left:4px;color:var(--muted);vertical-align:1px}
.verbar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.verbar a{color:var(--muted)}
.syncbar{font-size:13px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--surface);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 14px}
.syncbar b{font-weight:600}
.syncbar.ok{border-color:#2e9e5b}
.syncbar.warn{border-color:#d99a00}
.syncbar.bad{border-color:var(--err);background:var(--err-bg);color:var(--err)}
table.pt th,table.pt td{padding:6px 3px;font-size:12.5px}
table.pt th:first-child,table.pt td:first-child{position:sticky;left:0;background:var(--surface);padding-left:0;padding-right:6px}
</style>
</head>
<body>
<div class="wrap">
  <div id="err" class="err" hidden></div>
  <div class="verbar"><span>GameScore v1.4</span><a href="https://github.com/jamesonespence/Gamescore/blob/main/RELEASE_NOTES.md" target="_blank" rel="noopener">Release notes</a></div>
  <div id="sync" class="syncbar" hidden></div>
  <div id="picker" class="pickrow" hidden></div>
  <div id="app"><section class="panel"><p id="boot" style="margin:0">Loading live data...</p></section></div>
  <noscript><section class="panel">This card needs JavaScript to load live data.</section></noscript>
</div>
<script>
(function(){
var GAME_ID='2026020145';
try{var q=new URLSearchParams(location.search).get('game'); if(q&&/^\d{10}$/.test(q)) GAME_ID=q;}catch(e){}
var URL_PBP='https://api-web.nhle.com/v1/gamecenter/'+GAME_ID+'/play-by-play';
var POLL_LIVE=30000, POLL_PRE=60000;

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function nd(o){return o&&o.default?o.default:'';}
function pct(n,d){return d>0?n/d*100:null;}
function f1(x){return x==null?'-':x.toFixed(1)+'%';}
function f0(x){return x==null?'-':String(x);}
function cap(s){s=String(s||'').replace(/-/g,' ').replace(/_/g,' ');return s.charAt(0).toUpperCase()+s.slice(1);}
function other(s){return s==='a'?'h':'a';}

function perLabel(n,type){
  if(type==='SO') return 'SO';
  if(n<=3) return n+(n===1?'st':n===2?'nd':'rd');
  return n===4?'OT':(n-3)+'OT';
}

/* Situation code: away goalie, away skaters, home skaters, home goalie. */
function sk(code){
  var ag=code.charAt(0), as=+code.charAt(1), hs=+code.charAt(2), hg=code.charAt(3);
  if(ag==='0') as-=1;
  if(hg==='0') hs-=1;
  return {a:as,h:hs,ag:ag==='1',hg:hg==='1'};
}
function stateFor(code,side){
  var s=sk(code);
  if(s.a===s.h) return 'ev';
  var mine=side==='a'?s.a:s.h, theirs=side==='a'?s.h:s.a;
  return mine>theirs?'pp':'sh';
}
function is5v5(code){var s=sk(code);return s.a===5&&s.h===5&&s.ag&&s.hg;}

function perLong(n,type){
  if(type==='SO') return 'Shootout';
  if(n<=3) return perLabel(n,type)+' period';
  return n===4?'Overtime':(n-3)+'OT';
}
function pk(n){return n<=3?String(n):'ot';}
var KEYS=['all','1','2','3','ot'];

function mkSt(){return {sog:0,miss:0,blk:0,fw:0,fl:0};}
function mkTeam(){
  return {g:0,sog:0,miss:0,blkAtt:0,blocks:0,hits:0,gv:0,tk:0,fw:0,fl:0,pen:0,pim:0,ppg:0,hd:0,hdsog:0,hdg:0,
    st:{ev:mkSt(),pp:mkSt(),sh:mkSt()}, f5:{sog:0,miss:0,blk:0}};
}
function bump(t,state,five,kind){
  if(kind==='sog'){t.sog++;t.st[state].sog++;if(five)t.f5.sog++;}
  else if(kind==='miss'){t.miss++;t.st[state].miss++;if(five)t.f5.miss++;}
  else {t.blkAtt++;t.st[state].blk++;if(five)t.f5.blk++;}
}
function att(t){return t.sog+t.miss+t.blkAtt;}
function unb(t){return t.sog+t.miss;}
function att5(t){return t.f5.sog+t.f5.miss+t.f5.blk;}
function unb5(t){return t.f5.sog+t.f5.miss;}

/* High danger: unblocked attempt in the offensive zone, within about 25 ft of the net, not from a sharp angle. Rough estimate. */
function isHD(det){
  if(det.zoneCode!=='O') return false;
  if(typeof det.xCoord!=='number'||typeof det.yCoord!=='number') return false;
  var dx=89-Math.abs(det.xCoord), ay=Math.abs(det.yCoord);
  var dist=Math.sqrt(dx*dx+ay*ay);
  return dist<=25 && ay<=Math.max(dx,0)+8;
}

function analyze(d){
  var ids={}; ids[d.awayTeam.id]='a'; ids[d.homeTeam.id]='h';
  var roster={};
  (d.rosterSpots||[]).forEach(function(r){
    var first=nd(r.firstName), last=nd(r.lastName);
    roster[r.playerId]={team:r.teamId,name:(first+' '+last).replace(/^\s+|\s+$/g,''),last:last,pos:r.positionCode||''};
  });
  var S={}, PL={}, GK={};
  KEYS.forEach(function(k){S[k]={a:mkTeam(),h:mkTeam()};PL[k]={};GK[k]={};});
  var goals=[], pens=[], lastPer=1, K=['all','1'];
  function eachT(side,fn){K.forEach(function(k){fn(S[k][side]);});}
  function eachP(id,fn){
    if(!id) return;
    K.forEach(function(k){
      if(!PL[k][id]){
        var r=roster[id]||{};
        PL[k][id]={id:id,side:ids[r.team]||'a',name:r.name||('#'+id),last:r.last||('#'+id),pos:r.pos||'',g:0,a:0,sog:0,hits:0,blk:0,pim:0,fw:0,fl:0};
      }
      fn(PL[k][id]);
    });
  }
  function eachG(id,fn){
    if(!id) return;
    K.forEach(function(k){
      if(!GK[k][id]){var r=roster[id]||{};GK[k][id]={id:id,side:ids[r.team]||'a',name:r.name||('#'+id),last:r.last||('#'+id),saves:0,ga:0};}
      fn(GK[k][id]);
    });
  }
  (d.plays||[]).forEach(function(p){
    var det=p.details||{}, t=p.typeDescKey, code=p.situationCode||'1551';
    var pd=p.periodDescriptor||{}, n=pd.number||1;
    if(pd.periodType==='SO') return;
    if(n>lastPer) lastPer=n;
    K=['all',pk(n)];
    var os=ids[det.eventOwnerTeamId], s, st, five;
    if(t==='goal'||t==='shot-on-goal'||t==='missed-shot'){
      s=os; if(!s) return;
      st=stateFor(code,s); five=is5v5(code);
      var kind=t==='missed-shot'?'miss':'sog';
      var hd=isHD(det);
      var shooter=det.scoringPlayerId||det.shootingPlayerId;
      eachT(s,function(x){
        bump(x,st,five,kind);
        if(hd){x.hd++; if(kind==='sog')x.hdsog++; if(t==='goal')x.hdg++;}
      });
      if(kind==='sog') eachP(shooter,function(x){x.sog++;});
      if(det.goalieInNetId){
        if(t==='goal') eachG(det.goalieInNetId,function(g){g.ga++;});
        else if(t==='shot-on-goal') eachG(det.goalieInNetId,function(g){g.saves++;});
      }
      if(t==='goal'){
        eachT(s,function(x){x.g++; if(st==='pp')x.ppg++;});
        eachP(shooter,function(x){x.g++;});
        eachP(det.assist1PlayerId,function(x){x.a++;});
        eachP(det.assist2PlayerId,function(x){x.a++;});
        var en=(s==='a'&&code.charAt(3)==='0')||(s==='h'&&code.charAt(0)==='0');
        goals.push({side:s,per:n,ptype:pd.periodType,time:p.timeInPeriod,scorer:shooter,stotal:det.scoringPlayerTotal,
          a1:det.assist1PlayerId,a1t:det.assist1PlayerTotal,a2:det.assist2PlayerId,a2t:det.assist2PlayerTotal,
          state:st,en:en,shot:det.shotType||''});
      }
    } else if(t==='blocked-shot'){
      var sh=roster[det.shootingPlayerId];
      var s2=sh?ids[sh.team]:(os?other(os):null);
      if(!s2) return;
      var f5=is5v5(code), st2=stateFor(code,s2);
      eachT(s2,function(x){bump(x,st2,f5,'blk');});
      var bl=roster[det.blockingPlayerId];
      var bs=bl?ids[bl.team]:other(s2);
      eachT(bs,function(x){x.blocks++;});
      eachP(det.blockingPlayerId,function(x){x.blk++;});
    } else if(t==='hit'){
      if(!os) return;
      eachT(os,function(x){x.hits++;});
      eachP(det.hittingPlayerId,function(x){x.hits++;});
    } else if(t==='giveaway'){
      if(!os) return; eachT(os,function(x){x.gv++;});
    } else if(t==='takeaway'){
      if(!os) return; eachT(os,function(x){x.tk++;});
    } else if(t==='faceoff'){
      if(!os) return;
      var l=other(os), so=stateFor(code,os), sl=stateFor(code,l);
      eachT(os,function(x){x.fw++;x.st[so].fw++;});
      eachT(l,function(x){x.fl++;x.st[sl].fl++;});
      eachP(det.winningPlayerId,function(x){x.fw++;});
      eachP(det.losingPlayerId,function(x){x.fl++;});
    } else if(t==='penalty'){
      var cm=det.committedByPlayerId?roster[det.committedByPlayerId]:null;
      var ps=cm?ids[cm.team]:os;
      if(!ps) return;
      var dur=det.duration||0;
      eachT(ps,function(x){x.pen++;x.pim+=dur;});
      if(cm) eachP(det.committedByPlayerId,function(x){x.pim+=dur;});
      pens.push({side:ps,per:n,time:p.timeInPeriod,who:cm?cm.name:'Bench',desc:det.descKey||'',dur:dur});
    }
  });
  Object.keys(roster).forEach(function(id){
    var r=roster[id]; if(r.pos==='G') return;
    K=KEYS; eachP(+id,function(){});
  });
  return {S:S,PL:PL,GK:GK,goals:goals,pens:pens,lastPer:lastPer,nPer:Math.max(3,lastPer),roster:roster};
}

function gameStatus(d){
  var s=d.gameState||'';
  if(s==='FUT'||s==='PRE') return 'pre';
  if(s==='FINAL'||s==='OFF') return 'final';
  return 'live';
}

function statRow(label,a,b,fa,fb,lead){
  var total=a+b, wa=total>0?(a/total*100):50;
  var la=lead&&a>b?' lead':'', lb=lead&&b>a?' lead':'';
  return '<div class="stat"><div class="sr"><span class="v l'+la+'">'+fa+'</span><span class="k">'+esc(label)+'</span><span class="v r'+lb+'">'+fb+'</span></div>'
    +'<div class="bar"><i class="a" style="width:'+wa.toFixed(1)+'%"></i><i class="b" style="width:'+(100-wa).toFixed(1)+'%"></i></div></div>';
}

function fmtT(sec,dash){
  if(sec==null) return '-';
  if(!sec&&dash) return '-';
  var m=Math.floor(sec/60), r=sec%60;
  return m+':'+(r<10?'0':'')+r;
}
function toiFn(d,per){
  var toi=d.toi||null, box=d.boxToi||null;
  return function(id){
    if(toi&&toi[id]){
      var o=toi[id], keys=per==='all'?Object.keys(o):[per], t=[0,0,0];
      keys.forEach(function(k){if(o[k]){t[0]+=o[k][0];t[1]+=o[k][1];t[2]+=o[k][2];}});
      return t;
    }
    if(toi&&per!=='all') return [0,0,0];
    if(box&&box[id]&&per==='all'){
      var p=String(box[id]).split(':'); return [(+p[0])*60+(+p[1]||0),null,null];
    }
    return null;
  };
}
function playerTable(PLk,side,tf){
  var arr=[], any=false;
  Object.keys(PLk).forEach(function(k){
    var p=PLk[k];
    if(p.side!==side) return;
    p.toi=tf?tf(p.id):null; if(p.toi) any=true;
    arr.push(p);
  });
  arr.sort(function(x,y){
    return ((y.g+y.a)-(x.g+x.a))||(y.sog-x.sog)||(y.hits-x.hits)||(y.blk-x.blk)||(y.fw-x.fw)||((y.toi?y.toi[0]:0)-(x.toi?x.toi[0]:0))||(x.last<y.last?-1:1);
  });
  if(!arr.length) return '<p class="note">No player events in this period yet.</p>';
  var rows=arr.map(function(p){
    var fo=(p.fw+p.fl)>0?(p.fw+'/'+(p.fw+p.fl)):'-';
    var t=p.toi;
    return '<tr><td>'+esc(p.last)+'</td><td>'+p.g+'</td><td>'+p.a+'</td><td>'+p.sog+'</td><td>'+p.hits+'</td><td>'+p.blk+'</td><td>'+p.pim+'</td><td>'+fo+'</td>'
      +(any?'<td>'+(t?fmtT(t[0]):'-')+'</td><td>'+(t&&t[1]!=null?fmtT(t[1],true):'-')+'</td><td>'+(t&&t[2]!=null?fmtT(t[2],true):'-')+'</td>':'')+'</tr>';
  }).join('');
  return '<div class="tw"><table class="pt"><thead><tr><th>Player</th><th>G</th><th>A</th><th>SOG</th><th>Hit</th><th>Blk</th><th>PIM</th><th>FO</th>'+(any?'<th>TOI</th><th>PP</th><th>SH</th>':'')+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function goalieLines(GKk,side){
  var out=[];
  Object.keys(GKk).forEach(function(k){
    var g=GKk[k]; if(g.side!==side) return;
    var sa=g.saves+g.ga; if(!sa) return;
    out.push(esc(g.last)+': '+g.saves+' saves on '+sa+' shots ('+(g.saves/sa).toFixed(3).replace(/^0/,'')+')');
  });
  return out.length?'<p class="note" style="margin-top:6px">'+out.join('. ')+'</p>':'';
}

function startText(d){
  try{
    return new Date(d.startTimeUTC).toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'});
  }catch(e){return d.gameDate||'';}
}

function tvText(d){
  var tv=d.tvBroadcasts||[]; if(!tv.length) return '';
  var by={};
  tv.forEach(function(b){var c=b.countryCode||'';if(!by[c])by[c]=[];if(by[c].indexOf(b.network)<0)by[c].push(b.network);});
  var parts=Object.keys(by).map(function(c){return esc(c)+': '+esc(by[c].join(', '));});
  return '<p class="note">TV - '+parts.join('. ')+'.</p>';
}

function pairShare(x,y){var t=x+y; if(t<=0) return '-'; var a=Math.round(x/t*100); return a+'-'+(100-a);}

function periodCols(R){
  var cols=[['1','1st'],['2','2nd'],['3','3rd']];
  if(R.nPer>3) cols.push(['ot','OT']);
  cols.push(['all','Total']);
  return cols;
}
function reached(R,key){
  if(key==='all') return true;
  if(key==='ot') return R.lastPer>3;
  return +key<=R.lastPer;
}

/* Section: scoring and penalties grouped by period */
function scoringByPeriod(R,d,an,hn,status){
  if(status==='pre') return '<p class="note">No scoring yet.</p>';
  var nm=function(id){return id?esc((R.roster[id]||{}).name||('#'+id)):'';};
  var out='';
  for(var i=1;i<=R.nPer;i++){
    var gs=R.goals.filter(function(g){return g.per===i;});
    var ps=R.pens.filter(function(p){return p.per===i;});
    var ga=gs.filter(function(g){return g.side==='a';}).length, gh=gs.length-ga;
    out+='<div class="pgrp"><div class="ph"><span class="pn">'+esc(perLong(i,i>3?'OT':''))+'</span><span class="pscore"><span class="ta">'+an+'</span> '+ga+' <i>-</i> '+gh+' <span class="tb">'+hn+'</span></span></div>';
    if(!gs.length&&!ps.length){out+='<p class="note" style="margin:6px 0 0">No goals or penalties.</p></div>';continue;}
    if(gs.length){
      out+='<div class="subh">Goals</div><ul class="ev">'+gs.map(function(g){
        var tag=g.en?'EN':(g.state==='pp'?'PP':(g.state==='sh'?'SH':''));
        var as=[]; if(g.a1)as.push(nm(g.a1)+(g.a1t!=null?' ('+g.a1t+')':'')); if(g.a2)as.push(nm(g.a2)+(g.a2t!=null?' ('+g.a2t+')':''));
        var meta=(as.length?'Assists: '+as.join(', '):'Unassisted')+(g.shot?' - '+esc(cap(g.shot)):'');
        return '<li class="goal"><span class="tm">'+esc(g.time)+'</span><span class="badge '+(g.side==='a'?'a':'b')+'">'+(g.side==='a'?an:hn)+'</span>'
          +'<span class="tx"><span class="l1"><b>'+nm(g.scorer)+'</b>'+(g.stotal!=null?' ('+g.stotal+')':'')+(tag?' <em class="tag">'+tag+'</em>':'')+'</span><span class="l2">'+meta+'</span></span></li>';
      }).join('')+'</ul>';
    }
    if(ps.length){
      out+='<div class="subh">Penalties</div><ul class="ev">'+ps.map(function(p){
        return '<li class="pen"><span class="tm">'+esc(p.time)+'</span><span class="badge '+(p.side==='a'?'a':'b')+'">'+(p.side==='a'?an:hn)+'</span>'
          +'<span class="tx"><span class="l1">'+esc(p.who)+'</span><span class="l2">'+esc(cap(p.desc))+' - '+p.dur+' min</span></span></li>';
      }).join('')+'</ul>';
    }
    out+='</div>';
  }
  return out;
}

function lineScore(R,d,an,hn,status){
  var pd=d.periodDescriptor||{};
  var A=d.awayTeam, H=d.homeTeam;
  var sa=A.score==null?0:A.score, sh=H.score==null?0:H.score;
  var cols=periodCols(R).filter(function(c){return c[0]!=='all';});
  var n=cols.length+1;
  var h1='<tr class="g1"><th></th><th colspan="'+n+'" class="gl">Shots</th><th colspan="'+n+'" class="gl gr">Goals</th></tr>';
  var h2='<tr><th>Team</th>';
  var lbl=cols.map(function(c){return c[0]==='ot'?'OT':c[0];}).concat(['T']);
  lbl.forEach(function(x){h2+='<th>'+x+'</th>';});
  lbl.forEach(function(x,i){h2+='<th'+(i===0?' class="gr"':'')+'>'+x+'</th>';});
  h2+='</tr>';
  function row(side,ab,cls,total){
    var r='<tr><td class="'+cls+'"><b>'+ab+'</b></td>';
    cols.forEach(function(c){
      var ok=status!=='pre'&&reached(R,c[0])&&(c[0]==='ot'||+c[0]<=(pd.number||1)||status==='final');
      r+='<td>'+(ok?R.S[c[0]][side].sog:'-')+'</td>';
    });
    r+='<td class="tot"><b>'+R.S.all[side].sog+'</b></td>';
    cols.forEach(function(c,i){
      var ok=status!=='pre'&&reached(R,c[0])&&(c[0]==='ot'||+c[0]<=(pd.number||1)||status==='final');
      r+='<td'+(i===0?' class="gr"':'')+'>'+(ok?R.S[c[0]][side].g:'-')+'</td>';
    });
    r+='<td class="tot"><b>'+total+'</b></td></tr>';
    return r;
  }
  return '<div class="tw"><table class="ls"><thead>'+h1+h2+'</thead><tbody>'+row('a',an,'ta',sa)+row('h',hn,'tb',sh)+'</tbody></table></div>';
}

/* Section: shots and chances by period */
function shotsByPeriod(R,an,hn){
  var cols=periodCols(R);
  var metrics=[['Shot attempts (all)',att],['High danger chances',function(t){return t.hd;}]];
  var h='<th>Team</th>'+cols.map(function(c){return '<th>'+c[1]+'</th>';}).join('');
  var rows='';
  metrics.forEach(function(m){
    rows+='<tr class="grp"><td colspan="'+(cols.length+1)+'">'+esc(m[0])+'</td></tr>';
    [['a',an,'ta'],['h',hn,'tb']].forEach(function(x){
      rows+='<tr><td class="'+x[2]+'"><b>'+x[1]+'</b></td>'+cols.map(function(c){
        return '<td'+(c[0]==='all'?' class="tot"':'')+'>'+(reached(R,c[0])?m[1](R.S[c[0]][x[0]]):'-')+'</td>';
      }).join('')+'</tr>';
    });
  });
  return '<div class="tw"><table><thead><tr>'+h+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

/* Section: advanced share stats by period */
function advByPeriod(R,an,hn){
  var cols=periodCols(R);
  var defs=[
    ['Corsi (all attempts)',function(a,b){return pairShare(att(a),att(b));}],
    ['Fenwick (unblocked)',function(a,b){return pairShare(unb(a),unb(b));}],
    ['5v5 Corsi',function(a,b){return pairShare(att5(a),att5(b));}],
    ['High danger',function(a,b){return pairShare(a.hd,b.hd);}],
    ['Shots on goal',function(a,b){return pairShare(a.sog,b.sog);}]
  ];
  var h='<th>'+an+' - '+hn+' %</th>'+cols.map(function(c){return '<th>'+c[1]+'</th>';}).join('');
  var rows=defs.map(function(df){
    return '<tr><td>'+esc(df[0])+'</td>'+cols.map(function(c){
      return '<td'+(c[0]==='all'?' class="tot"':'')+'>'+(reached(R,c[0])?df[1](R.S[c[0]].a,R.S[c[0]].h):'-')+'</td>';
    }).join('')+'</tr>';
  }).join('');
  return '<div class="tw"><table><thead><tr>'+h+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function glossary(){
  return '<details class="gloss"><summary>What do these terms mean?</summary><dl>'
  +'<dt>Shot attempts (Corsi)</dt><dd>Every shot try: shots on goal + missed shots + blocked shots.</dd>'
  +'<dt>Unblocked attempts (Fenwick)</dt><dd>Shot attempts that were not blocked: shots on goal + shots that missed the net. Blocked shots are left out because they never reached the net.</dd>'
  +'<dt>For % (Corsi / Fenwick)</dt><dd>A team\'s share of the attempts while both teams are on the ice. Over 50% means that team is generating more of the play.</dd>'
  +'<dt>5v5</dt><dd>Only plays with five skaters and a goalie per side. Removes power-play noise.</dd>'
  +'<dt>High danger chance</dt><dd>An unblocked attempt in the offensive zone within about 25 feet of the net and not from a sharp angle (roughly the slot). Estimated from shot location, so it will not match other sites exactly. Blocked shots are not counted.</dd>'
  +'<dt>PDO</dt><dd>Shooting % plus save %. Near 100 is normal; far above or below usually means luck is swinging the score.</dd>'
  +'</dl></details>';
}

    +'<section class="panel"><h2>Attempts by period</h2><div style="margin-top:8px">'+shotsByPeriod(R,an,hn)+'</div>'

    if(ta.hd+tb.hd>0) read.push('<li><b>High danger:</b> '+an+' '+ta.hd+', '+hn+' '+tb.hd+' ('+ta.hdg+' and '+tb.hdg+' of them went in).</li>');
    if(ta.gv+tb.gv>0) read.push('<li><b>Puck management:</b> '+an+' '+ta.gv+' giveaways and '+ta.tk+' takeaways, '+hn+' '+tb.gv+' giveaways and '+tb.tk+' takeaways.</li>');
    if(ta.fw+ta.fl>0) read.push('<li><b>Faceoffs:</b> '+an+' '+f1(foA)+', '+hn+' '+f1(foH)+'.</li>');
    var readHtml=read.length?'<ul class="read">'+read.join('')+'</ul>':'';
    body='<section class="panel"><h2>Advanced stats</h2><p class="sub" style="margin:2px 0 8px">Showing: '+esc(perName)+'. Computed from play-by-play events. No expected goals.</p>'
      +adv
      +'<h3 class="h3m">Shots on goal by game state</h3>'+splits
      +'<p class="note">Unblocked = shots on goal plus missed shots (blocked shots left out).</p>'
      +'<h3 class="h3m">Faceoffs by strength</h3>'+fos+readHtml+'</section>'
      +'<section class="panel"><h2>Advanced by period</h2><div style="margin-top:8px">'+advByPeriod(R,an,hn)+'</div>'
      +'<p class="note">Each cell is '+an+' share - '+hn+' share, in percent. A dash means the period has not been played.</p></section>'
      +'<section class="panel">'+glossary()+'</section>';
  } else {
    var tf=toiFn(d,per);
    body='<section class="panel"><h2>Players</h2><p class="sub" style="margin:2px 0 0">Showing: '+esc(perName)+'</p>'
    +'<div class="cols" style="margin-top:12px"><div><h3 class="ta">'+an+' players</h3>'+playerTable(R.PL[per],'a',tf)+goalieLines(R.GK[per],'a')+'</div>'
    +'<div><h3 class="tb">'+hn+' players</h3>'+playerTable(R.PL[per],'h',tf)+goalieLines(R.GK[per],'h')+'</div></div>'
    +'<p class="note">All skaters, sorted by points, then shots, hits, blocks, faceoff wins and ice time. TOI = total time on ice, PP = on the power play, SH = shorthanded. PP and SH are estimated from shifts and play-by-play, so they can be off by a few seconds.</p></section>';
  }

  var title=esc(nd(A.commonName)||A.abbrev)+' at '+esc(nd(H.commonName)||H.abbrev);
  var venue=nd(d.venue);

  return ''
  +'<div class="top"><div><h1>'+title+'</h1><div class="sub">'+esc(startText(d))+(venue?' - '+esc(venue):'')+'</div></div>'
  +'<div class="chips"><span class="chip'+(status==='live'?' live':'')+'"><span class="dot"></span>'+esc(chipTxt)+'</span>'
  +'<button class="btn" id="refresh" type="button">Refresh now</button></div></div>'
  +'<section class="panel" aria-label="Score and clock"><div class="board">'
  +'<div class="team"><span class="abbr ta">'+an+'</span><span class="num">'+scoreA+'</span><span class="tname">'+esc(nd(A.commonName))+' - away</span></div>'
  +'<div class="clock"><span class="t">'+esc(clockT)+'</span><span class="p">'+esc(clockP)+'</span></div>'
  +'<div class="team r"><span class="abbr tb">'+hn+'</span><span class="num">'+scoreH+'</span><span class="tname">'+esc(nd(H.commonName))+' - home</span></div>'
  +'</div><div class="bottom">'+head+'</div></section>'
  +'<div class="nav">'+viewBtns+perBtns+'</div>'
  +body
  +'<p class="note" style="margin:0">Source: NHL play-by-play. '+(updatedText?esc(updatedText)+'. ':'')+(status==='final'?'Game over, refresh stopped.':'Refreshes every 30 seconds while the game is on.')+' Counts come from play events and can differ slightly from the official box score.</p>';
}

/* ---- browser wiring ---- */
function start(){
  var app=document.getElementById('app'), errEl=document.getElementById('err'), pickEl=document.getElementById('picker');
  var RAW='https://raw.githubusercontent.com/jamesonespence/Gamescore/main/';
  var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var timer=null, busy=false, sel=null, games=null, saved=[], listSig='', team='', todayStr='', ui={view:'score',per:'all'}, lastD=null, lastTxt='';
  try{var qg=new URLSearchParams(location.search).get('game'); if(qg&&/^\d{10}$/.test(qg)) sel=qg;}catch(e){}
  function showErr(msg){errEl.textContent=msg;errEl.hidden=false;}
  function clearErr(){errEl.hidden=true;}
  function schedule(ms){if(timer)clearTimeout(timer);timer=ms?setTimeout(load,ms):null;}
  function getJSON(path){
    return fetch(RAW+path+'?t='+Date.now(),{cache:'no-store'}).then(function(r){
      if(!r.ok){var e=new Error('HTTP '+r.status);e.status=r.status;throw e;}
      return r.json();
    });
  }
  function isSaved(id){return saved.indexOf(Number(id))>=0;}
  function tm(g){
    try{return new Date(g.start).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});}catch(e){return 'upcoming';}
  }
  function label(g){
    var s=g.state, tail='';
    if(s==='LIVE'||s==='CRIT') tail=' - LIVE '+(g.as==null?0:g.as)+'-'+(g.hs==null?0:g.hs);
    else if(s==='OFF'||s==='FINAL') tail=' - Final '+(g.as==null?'':g.as)+'-'+(g.hs==null?'':g.hs);
    else tail=' - '+(g.start?tm(g):'upcoming');
    return g.away+' at '+g.home+tail;
  }
  function dayLabel(ds,today){
    var d=String(ds||'').split('-'); if(d.length!==3) return ds||'';
    var t=MONTHS[+d[1]-1]+' '+(+d[2]);
    if(ds===today) return 'Today - '+t;
    var dt=new Date(+d[0],+d[1]-1,+d[2]), td=String(today||'').split('-');
    if(td.length===3){
      var diff=Math.round((dt-new Date(+td[0],+td[1]-1,+td[2]))/86400000);
      if(diff===1) return 'Tomorrow - '+t;
      if(diff===-1) return 'Yesterday - '+t;
    }
    return t;
  }
  function mine(g){return g.away===team||g.home===team;}
  function autoPick(){
    var c=(games||[]).filter(function(g){return isSaved(g.id);});
    if(!c.length) return null;
    function rank(a,b){
      var ma=mine(a)?0:1, mb=mine(b)?0:1; if(ma!==mb) return ma-mb;
      var sa=a.start||'', sb=b.start||''; return sa<sb?1:(sa>sb?-1:0);
    }
    var live=c.filter(function(g){return g.state==='LIVE'||g.state==='CRIT';}).sort(rank);
    if(live.length) return String(live[0].id);
    var tdy=c.filter(function(g){return g.date===todayStr&&mine(g);}).sort(rank);
    if(tdy.length) return String(tdy[0].id);
    var fin=c.filter(function(g){return g.state==='OFF'||g.state==='FINAL';}).sort(rank);
    if(fin.length) return String(fin[0].id);
    return String(c.sort(rank)[0].id);
  }
  function buildPicker(){
    if(!games||!games.length) return;
    var sig=games.map(function(g){return g.id+':'+g.state+':'+g.as+':'+g.hs;}).join('|')+'#'+saved.join(',')+'#'+sel;
    if(sig===listSig) return;
    listSig=sig;
    var days={}, order=[];
    games.forEach(function(g){var k=g.date||''; if(!days[k]){days[k]=[];order.push(k);} days[k].push(g);});
    order.sort(function(x,y){
      var fx=x>=todayStr, fy=y>=todayStr;
      if(fx!==fy) return fx?-1:1;
      return fx?(x<y?-1:1):(x<y?1:-1);
    });
    var opts=order.map(function(k){
      var items=days[k].slice().sort(function(a,b){
        var ma=mine(a)?0:1, mb=mine(b)?0:1; if(ma!==mb) return ma-mb;
        var sa=a.start||'', sb=b.start||''; return sa<sb?-1:(sa>sb?1:0);
      });
      return '<optgroup label="'+esc(dayLabel(k,todayStr))+'">'+items.map(function(g){
        var ok=isSaved(g.id);
        return '<option value="'+g.id+'"'+(ok?'':' disabled')+(String(g.id)===String(sel)?' selected':'')+'>'+(mine(g)?'* ':'')+esc(label(g))+(ok?'':' (not available yet)')+'</option>';
      }).join('')+'</optgroup>';
    }).join('');
    pickEl.innerHTML='<label for="gamepick" class="sub">Game</label><select id="gamepick">'+opts+'</select>';
    pickEl.hidden=false;
    document.getElementById('gamepick').addEventListener('change',function(ev){
      sel=ev.target.value;
      try{history.replaceState(null,'','?game='+sel);}catch(e){}
      load();
    });
  }
  function load(){
    if(busy) return; busy=true;
    getJSON('games.json').then(function(j){games=j.games||[];saved=j.saved||[];team=j.team||'';todayStr=j.today||'';},function(){games=null;}).then(function(){
      if(!sel) sel=autoPick();
      buildPicker();
      if(!sel) throw new Error('No saved games yet. Run the Update game data workflow once.');
      return getJSON('data/'+sel+'.json').then(null,function(e){
        if(e&&e.status===404) throw new Error('No saved copy of this game yet.');
        throw e;
      });
    }).then(function(d){
      var now=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'});
      var ft='';
      try{ft=d.fetchedAt?new Date(d.fetchedAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'';}catch(e){}
      lastD=d; lastTxt='Updated '+now+' - using the GitHub copy of the NHL data'+(ft?', copied at '+ft:'')+', refreshed about every 5 minutes';
      app.innerHTML=renderHTML(d,lastTxt,ui);
      tick();
      clearErr();
      var s=gameStatus(d);
      schedule(s==='final'?0:(s==='pre'?POLL_PRE:POLL_LIVE));
    }).catch(function(e){
      showErr((e&&e.message?e.message:'Could not load the saved data')+' Retrying in 30 seconds.');
      schedule(POLL_LIVE);
    }).then(function(){busy=false;});
  }
  var syncEl=document.getElementById('sync');
  function clk(dt){return dt.toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'});}
  function dur(sec){
    sec=Math.max(0,Math.round(sec)); var m=Math.floor(sec/60), r=sec%60;
    return m>0?(m+'m '+(r<10?'0':'')+r+'s'):(r+'s');
  }
  function tick(){
    if(!syncEl||!lastD||!lastD.fetchedAt){return;}
    var f=new Date(lastD.fetchedAt), now=new Date();
    if(isNaN(f.getTime())) return;
    var age=(now-f)/1000, st=gameStatus(lastD), cls;
    if(st==='final') cls='';
    else cls=age<=420?'ok':(age<=900?'warn':'bad');
    syncEl.className='syncbar'+(cls?' '+cls:'');
    syncEl.hidden=false;
    syncEl.innerHTML='<span>Copied from NHL: <b>'+esc(clk(f))+'</b></span><span>Now: <b>'+esc(clk(now))+'</b></span><span>'+(st==='final'?'Final copy, '+dur(age)+' old':'Behind by: <b>'+dur(age)+'</b>')+'</span>';
  }
  setInterval(tick,1000);
  app.addEventListener('click',function(ev){
    var b=ev.target&&ev.target.closest?ev.target.closest('button'):null;
    if(!b) return;
    if(b.id==='refresh'){load();return;}
    var ch=false;
    if(b.getAttribute('data-view')){ui.view=b.getAttribute('data-view');ch=true;}
    if(b.getAttribute('data-per')){ui.per=b.getAttribute('data-per');ch=true;}
    if(ch&&lastD){app.innerHTML=renderHTML(lastD,lastTxt,ui);}
  });
  load();
}
if(typeof document!=='undefined'&&document.getElementById){start();}
if(typeof module!=='undefined'){module.exports={analyze:analyze,renderHTML:renderHTML};}
})();
</script>
</body>
</html>
